<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>荒謬宇宙：16手勢修羅場 (五戰勝版)</title>
    <style>
        body { font-family: 'Noto Serif TC', serif, 'Courier New', monospace; background: #0a0a0a; color: #eee; text-align: center; margin: 0; overflow-x: hidden; }
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        #selection-screen, #game-screen { display: none; }
        .active { display: block !important; }
        
        h1 { font-size: 3em; color: #ff4757; text-shadow: 3px 3px 0px #550000; letter-spacing: 5px; }

        /* 錦旗狀敵人選擇樣式 */
        .enemy-list { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; margin-top: 40px; }
        .enemy-card { 
            position: relative; width: 110px; height: 320px; 
            background: #1a1a1a; border: 3px solid #444; 
            cursor: pointer; transition: 0.4s; overflow: hidden;
            box-shadow: 10px 10px 20px rgba(0,0,0,0.5);
        }
        .enemy-card:hover { border-color: #ff4757; transform: translateY(-15px) rotate(1deg); box-shadow: 0 0 30px rgba(255, 71, 87, 0.4); }
        .enemy-card img { width: 100%; height: 80%; object-fit: cover; filter: grayscale(80%); transition: 0.3s; }
        .enemy-card:hover img { filter: grayscale(0%); }
        .enemy-card .name-tag { 
            writing-mode: vertical-rl; text-orientation: upright; 
            font-size: 20px; font-weight: bold; padding: 8px;
            background: #ff4757; color: #000; position: absolute; top: 5px; right: 5px;
        }
        .enemy-card .desc { font-size: 11px; padding: 5px; color: #aaa; background: rgba(0,0,0,0.8); }

        /* 戰鬥畫面樣式 */
        .battle-area { display: flex; justify-content: space-around; align-items: flex-start; margin-top: 30px; }
        .choice-box { width: 220px; }
        .choice-img { width: 180px; height: 180px; border: 5px solid #333; background: #222; margin-bottom: 10px; }
        
        /* 計分板 */
        .score-board { font-size: 50px; font-weight: bold; color: #ffc107; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255,193,7,0.5); }
        .hp-bar { width: 100%; height: 12px; background: #222; border: 1px solid #444; margin-top: 5px; }
        .hp-fill { height: 100%; background: #ff4757; width: 0%; transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            40% { transform: translate(3px, 2px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(-1deg); }
            80% { transform: translate(3px, 1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }
        .shake { animation: shake 0.4s; }

        .icons-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 30px; border-top: 1px solid #333; padding-top: 20px; }
        .icon-btn { border: 2px solid #444; background: #111; padding: 5px; cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { border-color: #ff4757; background: #222; transform: scale(1.05); }
        .icon-btn img { width: 45px; height: 45px; object-fit: contain; }
        .icon-name { font-size: 10px; display: block; margin-top: 3px; color: #bbb; }

        #log { margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.9); height: 120px; overflow-y: auto; border-left: 5px solid #ff4757; text-align: left; font-size: 14px; line-height: 1.6; }
        
        #finish-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; justify-content: center; align-items: center; 
        }
        #finish-overlay h2 { font-size: 80px; margin: 0; font-family: 'Noto Serif TC'; }
        
        button.action-btn { background: #ff4757; color: white; border: none; padding: 15px 50px; font-size: 20px; cursor: pointer; font-weight: bold; margin-top: 30px; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="container">
    <h1>荒謬修羅場</h1>
    <p>—— 宿命的五局對決：只有意志堅定者能存活 ——</p>
    <hr style="border-color: #333;">

    <div id="selection-screen" class="active">
        <h2>選擇你的對手</h2>
        <div class="enemy-list" id="enemy-list"></div>
    </div>

    <div id="game-screen">
        <div class="battle-area">
            <div class="choice-box" id="player-side">
                <div class="score-board" id="player-score">0</div>
                <div class="hp-bar"><div id="player-hp" class="hp-fill"></div></div>
                <h3>挑戰者 (你)</h3>
                <img id="player-choice-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" class="choice-img">
                <p id="player-choice-name">-</p>
            </div>

            <div style="margin-top: 80px;">
                <h2 id="result-text" style="font-size: 40px;">VS</h2>
                <button onclick="resetGame()" style="background:#333; color:#aaa; border:1px solid #444; cursor:pointer;">撤退</button>
            </div>

            <div class="choice-box" id="enemy-side">
                <div class="score-board" id="enemy-score">0</div>
                <div class="hp-bar"><div id="enemy-hp" class="hp-fill"></div></div>
                <h3><span id="current-enemy-name"></span></h3>
                <img id="enemy-choice-img" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" class="choice-img">
                <p id="enemy-choice-name">-</p>
            </div>
        </div>

        <div class="icons-grid" id="icons-grid"></div>
        <div id="log">系統：生死有命，富貴在天。</div>
    </div>
</div>

<div id="finish-overlay">
    <h2 id="finish-title">VICTORY</h2>
    <p id="finish-msg">-</p>
    <button class="action-btn" onclick="resetGame()">凱旋歸來</button>
</div>

<script>
    const icons = [
        "黑人", "肯德基", "西瓜", "百香果", 
        "賴清德", "柯文哲", "離散數學", "隕石",
        "大腳", "棉花", "白人", "農場主", 
        "憤怒者", "SADGUY", "67", "至高無上之神"
    ];

    const enemies = [
        { id: 'A', name: '王子齊', logic: 'random', desc: '不可預測的亂源。' },
        { id: 'B', name: '亞里斯多德', logic: 'stat', desc: '看透數據的哲學家。' },
        { id: 'C', name: '薯泥', logic: 'copy', desc: '無情的鏡像機器。' },
        { id: 'D', name: '無尾熊', logic: 'venge', desc: '咬住不放的復仇者。' },
        { id: 'E', name: '艦長', logic: 'venge', desc: '固執己見的老頑童。' },
        { id: 'F', name: '無賴派文豪', logic: 'markov', desc: '預測你下一個韻律。' },
        { id: 'G', name: '薩摩示現流', logic: 'aggressive', desc: '摧毀你最強的招式。' },
        { id: 'H', name: '命運之輪', logic: 'adaptive', desc: '動態進化的殺意。' }
    ];

    let currentEnemy = null;
    let history = []; 
    let pScore = 0;
    let eScore = 0;
    let bureauCounter = 0;
    let isFinished = false;

    // --- 進階演算法數據空間 ---
    let markovChain = {}; 
    let strategyScores = { random: 0, counter: 0 };
    let lastPlayerMove = null;

    function init() {
        const enemyListDiv = document.getElementById('enemy-list');
        enemies.forEach(e => {
            const card = document.createElement('div');
            card.className = 'enemy-card';
            card.innerHTML = `
                <div class="name-tag">${e.name}</div>
                <img src="enemy_${e.id}.png" onerror="this.src='https://via.placeholder.com/110x300?text=${e.id}'">
                <div class="desc">${e.desc}</div>
            `;
            card.onclick = () => startBattle(e);
            enemyListDiv.appendChild(card);
        });

        const iconGrid = document.getElementById('icons-grid');
        icons.forEach((name, index) => {
            const btn = document.createElement('div');
            btn.className = 'icon-btn';
            btn.innerHTML = `
                <img src="icon_${index + 1}.png" onerror="this.src='https://via.placeholder.com/50?text=${index+1}'">
                <span class="icon-name">${name}</span>
            `;
            btn.onclick = () => playRound(index);
            iconGrid.appendChild(btn);
        });
    }

    function startBattle(enemy) {
        currentEnemy = enemy;
        pScore = 0; eScore = 0; isFinished = false;
        history = [];
        markovChain = {};
        lastPlayerMove = null;
        strategyScores = { random: 0, counter: 0 };
        
        bureauCounter = Math.floor(Math.random() * 16);
        updateScoreDisplay();
        document.getElementById('current-enemy-name').innerText = enemy.name;
        document.getElementById('selection-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        addLog(`【${enemy.name}】冷冷地看著你... (先得五分者勝)`);
    }

    function playRound(playerChoice) {
        if(isFinished) return;

        const enemyChoice = getEnemyChoice(playerChoice);
        const result = calculateWinner(playerChoice, enemyChoice);
        
        document.getElementById('player-choice-img').src = `icon_${playerChoice + 1}.png`;
        document.getElementById('player-choice-name').innerText = icons[playerChoice];
        document.getElementById('enemy-choice-img').src = `icon_${enemyChoice + 1}.png`;
        document.getElementById('enemy-choice-name').innerText = icons[enemyChoice];
        
        const resText = document.getElementById('result-text');
        if(result === 'win') {
            pScore++;
            resText.innerText = "得點！";
            resText.style.color = "#2ed573";
            document.getElementById('enemy-side').classList.add('shake');
            setTimeout(() => document.getElementById('enemy-side').classList.remove('shake'), 400);
            addLog(`<span style="color:#2ed573">【勝】</span> [${icons[playerChoice]}] 擊潰了對手！`);
        } else if(result === 'lose') {
            eScore++;
            resText.innerText = "失分！";
            resText.style.color = "#ff4757";
            document.getElementById('player-side').classList.add('shake');
            setTimeout(() => document.getElementById('player-side').classList.remove('shake'), 400);
            addLog(`<span style="color:#ff4757">【敗】</span> 被對方的 [${icons[enemyChoice]}] 命中！`);
        } else {
            resText.innerText = "抵消";
            resText.style.color = "#ffa502";
            addLog(`平手。雙方勢均力敵。`);
        }

        // 更新馬可夫鏈數據
        if (lastPlayerMove !== null) {
            if (!markovChain[lastPlayerMove]) markovChain[lastPlayerMove] = new Array(16).fill(0);
            markovChain[lastPlayerMove][playerChoice]++;
        }
        lastPlayerMove = playerChoice;
        
        history.push({player: playerChoice, enemy: enemyChoice, result: result});
        updateScoreDisplay();
        checkBattleEnd();
    }

    function getEnemyChoice(playerChoice) {
        let prediction = Math.floor(Math.random() * 16);

        switch(currentEnemy.logic) {
            case 'random': return Math.floor(Math.random() * 16);
            case 'copy': return history.length === 0 ? Math.floor(Math.random() * 16) : history[history.length-1].player;
            case 'bureau': bureauCounter = (bureauCounter + 4) % 16; return bureauCounter;
            case 'venge':
                const last = history[history.length - 1];
                if(last && last.result === 'win') return (last.player + 4) % 16;
                return Math.floor(Math.random() * 16);
            case 'stat':
                if(history.length < 3) return Math.floor(Math.random() * 16);
                const counts = new Array(16).fill(0);
                history.forEach(h => counts[h.player]++);
                prediction = counts.indexOf(Math.max(...counts));
                return (prediction + 4) % 16;

            // --- 新增強大演算法 ---
            case 'markov':
                if (lastPlayerMove !== null && markovChain[playerChoice]) {
                    const nextFreq = markovChain[playerChoice];
                    prediction = nextFreq.indexOf(Math.max(...nextFreq));
                    return (prediction + 5) % 16; 
                }
                return Math.floor(Math.random() * 16);

            case 'aggressive':
                const winCounts = new Array(16).fill(0);
                history.filter(h => h.result === 'win').forEach(h => winCounts[h.player]++);
                const fav = winCounts.indexOf(Math.max(...winCounts));
                if (winCounts[fav] > 0 && Math.random() < 0.7) return (fav + 4) % 16;
                return Math.floor(Math.random() * 16);

            case 'adaptive':
                if (history.length > 0) {
                    const last = history[history.length - 1];
                    if (last.result === 'lose') strategyScores.counter++;
                    else strategyScores.random++;
                }
                if (strategyScores.counter > strategyScores.random) {
                    return (playerChoice + 4) % 16;
                }
                return Math.floor(Math.random() * 16);

            default: return Math.floor(Math.random() * 16);
        }
    }

    function calculateWinner(n, m) {
        if (n === m) return 'draw';
        const D = (m - n + 16) % 16;
        if (D >= 1 && D <= 7) return 'win';
        if (D >= 9 && D <= 15) return 'lose';
        return 'paradox';
    }

    function updateScoreDisplay() {
        document.getElementById('player-score').innerText = pScore;
        document.getElementById('enemy-score').innerText = eScore;
        document.getElementById('player-hp').style.width = (pScore / 5 * 100) + '%';
        document.getElementById('enemy-hp').style.width = (eScore / 5 * 100) + '%';
    }

    function checkBattleEnd() {
        if(pScore >= 5 || eScore >= 5) {
            isFinished = true;
            const overlay = document.getElementById('finish-overlay');
            const title = document.getElementById('finish-title');
            const msg = document.getElementById('finish-msg');
            
            setTimeout(() => {
                overlay.style.display = 'flex';
                if(pScore >= 5) {
                    title.innerText = "武運昌隆";
                    title.style.color = "#2ed573";
                    msg.innerText = `你在修羅場中擊敗了 ${currentEnemy.name}。`;
                } else {
                    title.innerText = "命運終結";
                    title.style.color = "#ff4757";
                    msg.innerText = `你倒在了 ${currentEnemy.name} 的面前...`;
                }
            }, 600);
        }
    }

    function addLog(msg) {
        const log = document.getElementById('log');
        log.innerHTML = msg + "<br>" + log.innerHTML;
    }

    function resetGame() {
        history = [];
        pScore = 0; eScore = 0;
        document.getElementById('finish-overlay').style.display = 'none';
        document.getElementById('selection-screen').classList.add('active');
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('result-text').innerText = "VS";
        document.getElementById('result-text').style.color = "#eee";
    }

    init();
</script>

</body>
</html>
